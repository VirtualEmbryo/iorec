[build-system]
requires = ["hatchling>=1.27"]    # PEP 639 license expression
build-backend = "hatchling.build"


[project]
name = "iorec"
version = "1.4.0"
authors = [{ name = "Matthieu Perez", email = "matthieu.perez@cnrs.fr" }]
maintainers = [{ name = "Matthieu Perez", email = "matthieu.perez@cnrs.fr" }]
description = "Load and save multimaterial meshes: .rec, Surface Evolver, PLY, OBJ, 3MF"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

dependencies = ["numpy"]

# Optional installations
[project.optional-dependencies]
# Faster reading of large text .rec files (about 4 times; optional, same results)
pyarrow = ["pyarrow"]
# For the test environment
test = ["iorec[pyarrow]", "pytest >=6", "pytest-cov >=3"]
# For actively developping the package
dev = ["iorec[test]", "pipx", "nox", "mypy", "ruff"]

[project.scripts]
iorec-convert = "iorec.__main__:main"

[project.urls]
Homepage = "https://github.com/VirtualEmbryo/iorec"
"Bug Tracker" = "https://github.com/VirtualEmbryo/iorec/issues"
Discussions = "https://github.com/VirtualEmbryo/iorec/discussions"
Changelog = "https://github.com/VirtualEmbryo/iorec/releases"
[tool.hatch]
envs.default.dependencies = ["pytest", "pytest-cov"]

[tool.flake8]
extend-ignore = [
  "E501", # Line too long
]
extend-select = [ # Extensions
]
exclude = [ # ignore these files
  "tests/*",
  "noxfile.py",
  ".venv/*",
  ".nox/*",
]
max-complexity = 10

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "*.pyi",
]

line-length = 88

target-version = "py312"

[tool.ruff.lint]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = [
  "E",
  "F",
  "W",
  "C90",
  "I",
  "N",
  "D",
  "UP",
  "ANN",
  "S",
  "B",
  "A",
  "COM",
  # "CPY",
  "C4",
  "EM",
  "EXE",
  "FA",
  "ISC",
  # "INP",
  "PT",
  "Q",
  "SIM",
  "ARG",
  "PTH",
  "NPY",
  "PERF",
  "RUF",
]
ignore = ["S101", "ANN10"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

per-file-ignores = {}

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  ^/.nox/*  # one per line
)
'''

[tool.isort]
profile = "black"

[tool.mypy]
files = "src"
python_version = "3.12"
warn_unused_configs = true
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[tool.check-manifest]
ignore = [".pre-commit-config.yaml", "noxfile.py"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_cli_level = "INFO"
testpaths = ["tests"]

[tool.coverage.run]
omit = []

[tool.codespell]
skip = '*.po,*.ts'
count = ''
quiet-level = 3
